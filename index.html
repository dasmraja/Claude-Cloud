<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snakes &amp; Ladders</title>
<style>
  :root {
    --bg: #f4efe6;
    --panel: #ffffff;
    --ink: #2a2a2a;
    --muted: #6b665c;
    --line: #d9d1c1;
    --cell-a: #fbe9b7;
    --cell-b: #cfe8c8;
    --accent: #d9534f;
    --shadow: 0 6px 20px rgba(60, 40, 10, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --panel: #2a2926;
      --ink: #f0ebe0;
      --muted: #a39d8f;
      --line: #46433c;
      --cell-a: #6b5a2c;
      --cell-b: #3e5a3a;
      --shadow: 0 6px 20px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: .02em; }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 20px;
    align-items: start;
  }
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .board-wrap { width: min(100%, 78vh); margin: 0 auto; }
  #board {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    border: 4px solid var(--ink);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    container-type: inline-size;
  }
  .cell { position: relative; background: var(--cell-a); }
  .cell.alt { background: var(--cell-b); }
  .cell span {
    position: absolute; top: 2px; left: 4px;
    font-size: clamp(8px, 2.2cqw, 15px);
    font-weight: 700; color: var(--ink); opacity: .6;
  }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .token {
    position: absolute;
    width: 4.4%; height: 4.4%;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.5);
    transform: translate(-50%, -50%);
    transition: left .22s ease-out, top .22s ease-out;
    z-index: 5;
  }
  .token.slide { transition: left .9s ease-in-out, top .9s ease-in-out; }
  .token.active { animation: bob .7s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(-50%, -70%); } }

  aside { display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--shadow);
  }
  #players { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #players li {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    border: 2px solid transparent;
  }
  #players li.turn { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); flex: none; }
  .pname { flex: 1; font-weight: 600; }
  .ppos { color: var(--muted); font-variant-numeric: tabular-nums; }

  .dice-row { display: flex; align-items: center; gap: 16px; }
  #die {
    width: 72px; height: 72px; flex: none;
    background: #fff; border-radius: 14px; border: 2px solid #222;
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    padding: 9px; box-shadow: 0 3px 0 #222;
  }
  #die.rolling { animation: shake .12s linear infinite; }
  @keyframes shake { 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
  #die i { border-radius: 50%; background: transparent; margin: 3px; }
  #die i.on { background: #222; }

  button, select {
    font: inherit; color: var(--ink);
  }
  button {
    cursor: pointer; border: 0; border-radius: 10px;
    padding: 12px 18px; font-weight: 700;
    background: var(--accent); color: #fff;
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; padding: 8px 12px; }
  #rollBtn { flex: 1; font-size: 1.1rem; }

  #status { margin: 12px 0 0; min-height: 2.6em; font-weight: 600; }
  #log { margin: 0; padding: 0; list-style: none; font-size: .85rem; color: var(--muted); max-height: 140px; overflow: auto; display: grid; gap: 4px; }
  #log li:first-child { color: var(--ink); }

  dialog {
    border: 0; border-radius: 16px; padding: 24px; width: min(92vw, 400px);
    background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { margin: 0 0 14px; }
  .setup-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .setup-row select, .setup-row input[type=text] {
    padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .setup-row input[type=text] { flex: 1; min-width: 0; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .rules { font-size: .85rem; color: var(--muted); margin: 12px 0 0; line-height: 1.5; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    .board-wrap { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .token, .token.slide { transition-duration: .01s; }
    .token.active, #die.rolling { animation: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>🐍 Snakes &amp; Ladders 🪜</h1>
    <button class="ghost" id="newBtn">New game</button>
  </header>

  <div class="board-wrap">
    <div id="board" aria-label="Game board"></div>
  </div>

  <aside>
    <section class="card">
      <ul id="players" aria-label="Players"></ul>
    </section>
    <section class="card">
      <div class="dice-row">
        <div id="die" aria-live="polite" aria-label="Die"></div>
        <button id="rollBtn">Roll the dice</button>
      </div>
      <p id="status" aria-live="polite"></p>
    </section>
    <section class="card">
      <ul id="log" aria-label="Game log"></ul>
    </section>
  </aside>
</main>

<dialog id="setup">
  <form method="dialog" id="setupForm">
    <h2>New game</h2>
    <div class="setup-row">
      <label for="count">Players</label>
      <select id="count">
        <option>2</option><option>3</option><option>4</option>
      </select>
    </div>
    <div id="setupPlayers"></div>
    <p class="rules">
      Roll the die and race to square 100. Ladders lift you up, snakes drag you down.
      You must land on 100 with an exact roll. Rolling a 6 gives you another turn.
    </p>
    <div class="actions"><button type="submit" id="startBtn">Start</button></div>
  </form>
</dialog>

<dialog id="winDlg">
  <form method="dialog">
    <h2 id="winTitle"></h2>
    <p id="winText"></p>
    <div class="actions"><button id="againBtn" type="submit">Play again</button></div>
  </form>
</dialog>

<script>
(() => {
  'use strict';

  const SNAKES  = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
  const LADDERS = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };
  const COLORS  = ['#e63946', '#1d7ff0', '#f4a300', '#8e44ad'];
  const SNAKE_HUES = [130, 25, 280, 190, 340, 55, 165, 10, 250, 90];
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const NS = 'http://www.w3.org/2000/svg';

  const $ = (id) => document.getElementById(id);
  const board = $('board'), dieEl = $('die'), rollBtn = $('rollBtn');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- geometry ----------
  // Square n (1..100) -> centre in 0..100 board coordinates (boustrophedon layout).
  function center(n) {
    const row = Math.floor((n - 1) / 10);
    const c = (n - 1) % 10;
    const col = row % 2 === 0 ? c : 9 - c;
    return { x: col * 10 + 5, y: (9 - row) * 10 + 5 };
  }

  // ---------- board drawing ----------
  function buildBoard() {
    board.innerHTML = '';
    for (let row = 9; row >= 0; row--) {
      for (let col = 0; col < 10; col++) {
        const n = row * 10 + (row % 2 === 0 ? col : 9 - col) + 1;
        const cell = document.createElement('div');
        cell.className = 'cell' + ((row + col) % 2 ? ' alt' : '');
        cell.innerHTML = `<span>${n}</span>`;
        board.appendChild(cell);
      }
    }
    const svg = document.createElementNS(NS, 'svg');
    svg.id = 'overlay';
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    Object.entries(LADDERS).forEach(([a, b]) => svg.appendChild(drawLadder(+a, b)));
    Object.entries(SNAKES).forEach(([a, b], i) => svg.appendChild(drawSnake(+a, b, i)));
    board.appendChild(svg);
  }

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function drawLadder(from, to) {
    const g = el('g', {});
    const a = center(from), b = center(to);
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len, px = -uy, py = ux;
    const off = 1.4;
    for (const s of [-1, 1]) {
      el('line', {
        x1: a.x + px * off * s, y1: a.y + py * off * s,
        x2: b.x + px * off * s, y2: b.y + py * off * s,
        stroke: '#6d4322', 'stroke-width': 1.1, 'stroke-linecap': 'round',
      }, g);
    }
    const rungs = Math.max(2, Math.floor(len / 3.6));
    for (let i = 1; i <= rungs; i++) {
      const t = i / (rungs + 1);
      const cx = a.x + dx * t, cy = a.y + dy * t;
      el('line', {
        x1: cx - px * off, y1: cy - py * off, x2: cx + px * off, y2: cy + py * off,
        stroke: '#a8713a', 'stroke-width': .8, 'stroke-linecap': 'round',
      }, g);
    }
    return g;
  }

  function drawSnake(from, to, idx) {
    const g = el('g', {});
    const head = center(from), tail = center(to);
    const dx = tail.x - head.x, dy = tail.y - head.y, len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len, px = -uy, py = ux;
    const hue = SNAKE_HUES[idx % SNAKE_HUES.length];
    const waves = Math.max(1.5, Math.round(len / 14) + .5);
    const amp = Math.min(4.2, 1.6 + len / 14);
    const N = 44, pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const w = Math.sin(t * Math.PI * 2 * waves) * amp * Math.sin(Math.min(1, t * 6) * Math.PI / 2);
      pts.push({ x: head.x + dx * t + px * w, y: head.y + dy * t + py * w });
    }
    for (let i = 0; i < N; i++) {
      const t = i / N;
      const width = 2.5 - 1.8 * t;
      const light = (Math.floor(i / 3) % 2) ? 42 : 52;
      el('line', {
        x1: pts[i].x, y1: pts[i].y, x2: pts[i + 1].x, y2: pts[i + 1].y,
        stroke: `hsl(${hue} 65% ${light}%)`, 'stroke-width': width, 'stroke-linecap': 'round',
      }, g);
    }
    // head: oriented along the first segment, pointing away from the body
    const hx = pts[0].x, hy = pts[0].y;
    const ang = Math.atan2(pts[0].y - pts[3].y, pts[0].x - pts[3].x) * 180 / Math.PI;
    const h = el('g', { transform: `translate(${hx} ${hy}) rotate(${ang})` }, g);
    el('path', { d: 'M1.6 0 L4 -.6 M1.6 0 L4 .6', stroke: '#e11', 'stroke-width': .35, fill: 'none', 'stroke-linecap': 'round' }, h);
    el('ellipse', { cx: 0, cy: 0, rx: 2.3, ry: 1.9, fill: `hsl(${hue} 65% 40%)` }, h);
    for (const s of [-1, 1]) {
      el('circle', { cx: .7, cy: .95 * s, r: .55, fill: '#fff' }, h);
      el('circle', { cx: .85, cy: .95 * s, r: .28, fill: '#111' }, h);
    }
    return g;
  }

  // ---------- die ----------
  function showDie(v) {
    dieEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const p = document.createElement('i');
      if (PIPS[v].includes(i)) p.className = 'on';
      dieEl.appendChild(p);
    }
    dieEl.setAttribute('aria-label', `Die showing ${v}`);
  }

  // ---------- game state ----------
  let players = [], turn = 0, busy = true, over = false, session = 0;

  function log(msg) {
    const li = document.createElement('li');
    li.textContent = msg;
    const ul = $('log');
    ul.insertBefore(li, ul.firstChild);
    while (ul.children.length > 30) ul.removeChild(ul.lastChild);
  }
  const say = (msg) => { $('status').textContent = msg; };

  function renderPlayers() {
    const ul = $('players');
    ul.innerHTML = '';
    players.forEach((p, i) => {
      const li = document.createElement('li');
      if (i === turn && !over) li.className = 'turn';
      li.innerHTML = `<span class="dot" style="background:${p.color}"></span>
        <span class="pname"></span><span class="ppos">${p.pos === 0 ? 'start' : 'square ' + p.pos}</span>`;
      li.querySelector('.pname').textContent = p.name + (p.cpu ? ' 🤖' : '');
      ul.appendChild(li);
    });
  }

  function placeTokens(slide) {
    // group players that share a square so tokens do not sit on top of each other
    const groups = {};
    players.forEach((p, i) => (groups[p.pos] = groups[p.pos] || []).push(i));
    players.forEach((p, i) => {
      const g = groups[p.pos];
      const k = g.indexOf(i), n = g.length;
      let x, y;
      if (p.pos === 0) {
        // waiting strip along the bottom edge of square 1
        x = 3 + k * 4; y = 97;
      } else {
        const c = center(p.pos);
        const ang = (k / n) * Math.PI * 2;
        const r = n > 1 ? 2.6 : 0;
        x = c.x + Math.cos(ang) * r; y = c.y + Math.sin(ang) * r;
      }
      p.el.style.left = x + '%';
      p.el.style.top = y + '%';
      p.el.classList.toggle('slide', !!slide);
    });
  }

  function markActive() {
    players.forEach((p, i) => p.el.classList.toggle('active', i === turn && !over));
    renderPlayers();
  }

  function startGame(config) {
    session++;
    over = false; turn = 0;
    buildBoard();
    $('log').innerHTML = '';
    players = config.map((c, i) => {
      const t = document.createElement('div');
      t.className = 'token';
      t.style.background = COLORS[i];
      t.title = c.name;
      t.style.transition = 'none';
      board.appendChild(t);
      return { ...c, color: COLORS[i], pos: 0, el: t };
    });
    placeTokens(false);
    requestAnimationFrame(() => players.forEach((p) => (p.el.style.transition = '')));
    showDie(1);
    log('Game started. Good luck!');
    beginTurn();
  }

  function beginTurn() {
    markActive();
    const p = players[turn];
    busy = false;
    rollBtn.disabled = p.cpu;
    say(p.cpu ? `${p.name} is thinking…` : `${p.name}, your turn — roll the dice!`);
    if (p.cpu) {
      const s = session;
      sleep(900).then(() => { if (s === session) roll(); });
    }
  }

  async function roll() {
    if (busy || over) return;
    busy = true;
    rollBtn.disabled = true;
    const s = session;
    const p = players[turn];
    dieEl.classList.add('rolling');
    const spins = reduceMotion ? 1 : 8;
    for (let i = 0; i < spins; i++) { showDie(1 + Math.floor(Math.random() * 6)); await sleep(80); }
    if (s !== session) return;
    const v = 1 + Math.floor(Math.random() * 6);
    dieEl.classList.remove('rolling');
    showDie(v);
    log(`${p.name} rolled a ${v}`);
    await sleep(250);
    if (s !== session) return;

    if (p.pos + v > 100) {
      say(`${p.name} needs an exact roll to reach 100.`);
      log(`${p.name} needs exactly ${100 - p.pos} to win`);
      await sleep(900);
    } else {
      for (let i = 0; i < v; i++) {
        p.pos++;
        placeTokens(false);
        renderPlayers();
        await sleep(240);
        if (s !== session) return;
      }
      const dest = LADDERS[p.pos] || SNAKES[p.pos];
      if (dest) {
        const up = dest > p.pos;
        say(up ? `🪜 ${p.name} climbs a ladder to ${dest}!` : `🐍 ${p.name} is bitten and slides to ${dest}!`);
        log(`${p.name} ${up ? 'climbed' : 'slid'} ${p.pos} → ${dest}`);
        await sleep(350);
        p.pos = dest;
        placeTokens(true);
        renderPlayers();
        await sleep(1000);
        if (s !== session) return;
      }
      if (p.pos === 100) return win(p);
    }

    if (v === 6) {
      log(`${p.name} rolled a 6 and goes again`);
    } else {
      turn = (turn + 1) % players.length;
    }
    beginTurn();
  }

  function win(p) {
    over = true;
    markActive();
    rollBtn.disabled = true;
    say(`🏆 ${p.name} wins!`);
    log(`${p.name} reached 100 and wins!`);
    $('winTitle').textContent = `🏆 ${p.name} wins!`;
    $('winText').textContent = 'What a game. Ready for another round?';
    $('winDlg').showModal();
  }

  // ---------- setup dialog ----------
  function renderSetup() {
    const n = +$('count').value;
    const box = $('setupPlayers');
    const prev = [...box.querySelectorAll('.setup-row')].map((r) => ({
      name: r.querySelector('input').value, cpu: r.querySelector('select').value,
    }));
    box.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const row = document.createElement('div');
      row.className = 'setup-row';
      const old = prev[i] || { name: `Player ${i + 1}`, cpu: i === 0 ? 'human' : (n === 2 ? 'cpu' : 'human') };
      row.innerHTML = `<span class="dot" style="background:${COLORS[i]}"></span>
        <input type="text" maxlength="14" aria-label="Player ${i + 1} name">
        <select aria-label="Player ${i + 1} type"><option value="human">Human</option><option value="cpu">Computer</option></select>`;
      row.querySelector('input').value = old.name;
      row.querySelector('select').value = old.cpu;
      box.appendChild(row);
    }
  }

  function openSetup() { renderSetup(); $('setup').showModal(); }

  $('count').addEventListener('change', renderSetup);
  $('setupForm').addEventListener('submit', () => {
    const cfg = [...$('setupPlayers').querySelectorAll('.setup-row')].map((r, i) => ({
      name: r.querySelector('input').value.trim() || `Player ${i + 1}`,
      cpu: r.querySelector('select').value === 'cpu',
    }));
    startGame(cfg);
  });
  $('newBtn').addEventListener('click', openSetup);
  $('winDlg').addEventListener('close', openSetup);
  rollBtn.addEventListener('click', roll);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !document.querySelector('dialog[open]') && !rollBtn.disabled
        && document.activeElement !== rollBtn) {
      e.preventDefault();
      roll();
    }
  });

  // expose a tiny hook for automated testing
  window.__snl = { get players() { return players; }, snakes: SNAKES, ladders: LADDERS };

  buildBoard();
  showDie(1);
  say('Set up a game to begin.');
  rollBtn.disabled = true;
  openSetup();
})();
</script>
</body>
</html>
